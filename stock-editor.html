<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administración | Automotora One</title>
  <link rel="icon" href="logo-icon.png">
  <link rel="stylesheet" href="editor.css">
  <style>
    /* Estilos adicionales para pestañas y tabla (puedes moverlos a editor.css luego) */
    .tabs { display: flex; gap: 10px; margin-top: 10px; border-bottom: 2px solid var(--line); }
    .tab-btn { background: none; border: none; padding: 10px 20px; font-weight: bold; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -2px; }
    .tab-btn.active { color: var(--red); border-bottom-color: var(--red); }
    .tab-content { display: none; padding-top: 20px; }
    .tab-content.active { display: block; }
    
    .users-table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 12px rgba(0,0,0,.05); }
    .users-table th, .users-table td { padding: 12px 15px; text-align: left; border-bottom: 1px solid var(--line); }
    .users-table th { background: #fafafa; font-size: 0.85rem; color: #555; }
    
    .user-form { background: #fff; padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid var(--line); display: grid; grid-template-columns: 1fr 1fr 1fr 1fr auto; gap: 10px; align-items: end; }
    @media (max-width: 850px) { .user-form { grid-template-columns: 1fr 1fr; } .user-form button { grid-column: span 2; } }
  </style>
</head>
<body>

  <!-- Modal de Autenticación -->
  <div id="loginModal" style="position:fixed; inset:0; background:rgba(0,0,0,0.85); backdrop-filter:blur(4px); display:flex; align-items:center; justify-content:center; z-index:1000;">
    <form id="loginForm" style="background:#fff; padding:32px; border-radius:16px; width:min(400px, 90%); box-shadow:0 10px 30px rgba(0,0,0,0.3);">
      <div style="text-align: center; margin-bottom: 20px;">
        <img src="logo-full.png" alt="Automotora One" style="height: 40px; margin-bottom: 10px;">
        <h3 style="margin:0; font-size:1.5rem;">Acceso Administrativo</h3>
      </div>
      
      <label style="display:block; margin-bottom:12px; font-weight:bold; font-size:0.82rem;">
        Correo electrónico
        <input type="email" id="loginEmail" required placeholder="admin@automotoraone.cl" style="width:100%; padding:10px; margin-top:4px; border:1px solid #ccc; border-radius:8px;">
      </label>
      
      <label style="display:block; margin-bottom:20px; font-weight:bold; font-size:0.82rem;">
        Contraseña
        <input type="password" id="loginPassword" required placeholder="••••••••" style="width:100%; padding:10px; margin-top:4px; border:1px solid #ccc; border-radius:8px;">
      </label>
      
      <div id="loginError" style="color:var(--red); font-size:0.82rem; margin-bottom:12px; display:none; text-align: center;"></div>
      
      <button type="submit" class="btn primary" style="width:100%;">Ingresar al panel</button>
    </form>
  </div>

  <!-- Header -->
  <header class="top">
    <div class="wrap topin">
      <img class="logo" src="logo-full.png" alt="Automotora One">
      <h1>Panel de Administración</h1>
      <div class="spacer"></div>
      <button class="btn secondary" onclick="logout()">Cerrar sesión</button>
    </div>
  </header>

  <!-- Contenido Principal -->
  <main class="wrap">
    
    <!-- Pestañas -->
    <nav class="tabs">
      <button class="tab-btn active" onclick="switchTab('stock')">Inventario de Vehículos</button>
      <button class="tab-btn" onclick="switchTab('users')">Gestión de Administradores</button>
    </nav>

    <!-- PESTAÑA 1: STOCK -->
    <div id="stockTab" class="tab-content active">
        <div class="toolbar">
            <button class="btn primary" id="addBtn">+ Agregar vehículo</button>
        </div>
        <div class="cards" id="cards"></div>
    </div>

    <!-- PESTAÑA 2: USUARIOS -->
    <div id="usersTab" class="tab-content">
      <form class="user-form" id="createUserForm">
        <label>Nombre <input type="text" id="newUserFirstName" required></label>
        <label>Apellido <input type="text" id="newUserLastName" required></label>
        <label>Correo <input type="email" id="newUserEmail" required></label>
        <label>Contraseña <input type="password" id="newUserPassword" required minlength="6"></label>
        <button type="submit" class="btn primary">Crear Usuario</button>
      </form>
      
      <div id="usersMessage" style="color:var(--red); font-size:0.85rem; margin-bottom:10px;"></div>

      <table class="users-table">
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Apellido</th>
            <th>Correo Electrónico</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="usersTableBody">
          <tr><td colspan="4">Cargando usuarios...</td></tr>
        </tbody>
      </table>
    </div>

  </main>

  <!-- Barra de Guardado -->
  <div class="savebar" id="stockSaveBar">
    <div class="wrap savein">
      <button class="btn primary" id="saveBtn">Guardar cambios del stock</button>
      <a class="btn secondary" href="index.html" target="_blank">Abrir catálogo</a>
      <span class="status" id="status">Sin cambios</span>
    </div>
  </div>

  <script>
    // ==========================================
    // 1. CONFIGURACIÓN Y AUTENTICACIÓN
    // ==========================================
    const AUTH_API_URL = 'https://automotora-one-backend.onrender.com/auth/login';
    const USERS_API_URL = 'https://automotora-one-backend.onrender.com/auth/users';
    const VEHICLES_API_URL = 'https://automotora-one-backend.onrender.com/vehicles'; 

    function getToken() { return localStorage.getItem('jwt_token'); }

    function checkAuth() {
      const token = getToken();
      const modal = document.getElementById('loginModal');
      if (token) {
        modal.style.display = 'none';
        loadUsers(); 
        loadStock();
      } else {
        modal.style.display = 'flex';
      }
    }

    function logout() {
      localStorage.removeItem('jwt_token');
      checkAuth();
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;
      const errorDiv = document.getElementById('loginError');
      const btn = e.target.querySelector('button');

      errorDiv.style.display = 'none';
      btn.textContent = 'Verificando...';

      try {
        const response = await fetch(AUTH_API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        if (!response.ok) throw new Error('Credenciales incorrectas');
        const data = await response.json();
        localStorage.setItem('jwt_token', data.access_token || data.token);
        e.target.reset();
        checkAuth();
      } catch (err) {
        errorDiv.textContent = err.message;
        errorDiv.style.display = 'block';
      } finally {
        btn.textContent = 'Ingresar al panel';
      }
    });

    // ==========================================
    // 2. NAVEGACIÓN DE PESTAÑAS
    // ==========================================
    function switchTab(tabName) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
      
      event.target.classList.add('active');
      document.getElementById(`${tabName}Tab`).classList.add('active');
      
      document.getElementById('stockSaveBar').style.display = tabName === 'stock' ? 'block' : 'none';
    }

    // ==========================================
    // 3. GESTIÓN DE USUARIOS (CRUD CON BD)
    // ==========================================
    async function loadUsers() {
      try {
        const response = await fetch(USERS_API_URL, {
          headers: { 'Authorization': `Bearer ${getToken()}` }
        });
        if (response.status === 401) return logout(); 
        if (!response.ok) throw new Error('Error al cargar usuarios');
        
        const users = await response.json();
        const tbody = document.getElementById('usersTableBody');
        
        tbody.innerHTML = users.map(u => `
          <tr>
            <td>${u.first_name}</td>
            <td>${u.last_name}</td>
            <td>${u.email}</td>
            <td><button class="btn danger" style="padding: 6px 12px; font-size: 0.8rem;" onclick="deleteUser('${u.id}')">Eliminar</button></td>
          </tr>
        `).join('');
      } catch (error) {
        document.getElementById('usersMessage').textContent = error.message;
      }
    }

    document.getElementById('createUserForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('usersMessage');
      msg.textContent = 'Creando...';
      msg.style.color = '#555';

      const payload = {
        first_name: document.getElementById('newUserFirstName').value,
        last_name: document.getElementById('newUserLastName').value,
        email: document.getElementById('newUserEmail').value,
        password: document.getElementById('newUserPassword').value
      };

      try {
        const response = await fetch(USERS_API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${getToken()}` },
          body: JSON.stringify(payload)
        });

        if (response.status === 401) return logout();
        if (!response.ok) throw new Error('Error al crear (Correo ya existe o datos inválidos).');

        e.target.reset();
        msg.textContent = '';
        loadUsers(); 
      } catch (error) {
        msg.textContent = error.message;
        msg.style.color = 'var(--red)';
      }
    });

    async function deleteUser(id) {
      if (!confirm('¿Estás seguro de eliminar este administrador?')) return;
      try {
        const response = await fetch(`${USERS_API_URL}/${id}`, {
          method: 'DELETE',
          headers: { 'Authorization': `Bearer ${getToken()}` }
        });
        if (response.status === 401) return logout();
        if (!response.ok) throw new Error('Error al eliminar');
        loadUsers();
      } catch (error) {
        alert(error.message);
      }
    }

    // ==========================================
    // 4. GESTIÓN DE STOCK (CRUD CON BD)
    // ==========================================
    let cars = [];
    let dirty = false;

    async function loadStock() {
      try {
        const root = document.getElementById('cards');
        root.innerHTML = '<div class="card">Cargando vehículos desde la base de datos...</div>';
        
        const response = await fetch(VEHICLES_API_URL);
        if (!response.ok) throw new Error('Error al obtener los vehículos');
        
        cars = await response.json();
        // Limpiamos etiquetas locales de edición
        cars.forEach(c => { c._isDirty = false; c._isNew = false; });
        dirty = false;
        status('Stock sincronizado');
        renderStock();
      } catch (error) {
        document.getElementById('cards').innerHTML = `<div class="card" style="color:var(--red)">${error.message}</div>`;
      }
    }

    function esc(v = '') { return String(v).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m])); }

    function renderStock() {
      const root = document.getElementById('cards');
      if (!cars.length) { root.innerHTML = '<div class="card">No hay vehículos.</div>'; return; }
      
      root.innerHTML = cars.map((c, i) => {
        const imageUrl = c.image || (c.images && c.images[0] ? c.images[0].url : '');
        const imagesCount = c.images ? c.images.length : (c.image ? 1 : 0);
        
        return `
        <section class="card" data-i="${i}" style="${c._isDirty ? 'border: 2px solid var(--red);' : ''}">
          <div class="cardhead">
            <strong>${esc(c.brand)} ${esc(c.model)} ${c._isNew ? '(Sin guardar)' : ''}</strong>
            <button class="btn danger del" data-i="${i}">Eliminar</button>
          </div>
          <div class="grid">
            <label>Marca<input data-k="brand" value="${esc(c.brand)}"></label>
            <label>Modelo<input data-k="model" value="${esc(c.model)}"></label>
            <label>Año<input data-k="year" type="number" value="${c.year || ''}"></label>
            <label>Precio CLP<input data-k="price" type="number" value="${c.price || ''}"></label>
            <label>Kilometraje<input data-k="km" type="number" value="${c.km || ''}"></label>
            <label>Transmisión
              <select data-k="transmission">
                <option ${c.transmission === 'Automática' ? 'selected' : ''}>Automática</option>
                <option ${c.transmission === 'Manual' ? 'selected' : ''}>Manual</option>
              </select>
            </label>
            <label>Combustible
              <select data-k="fuel">
                <option ${c.fuel === 'Bencina' ? 'selected' : ''}>Bencina</option>
                <option ${c.fuel === 'Diésel' ? 'selected' : ''}>Diésel</option>
                <option ${c.fuel === 'Híbrido' ? 'selected' : ''}>Híbrido</option>
                <option ${c.fuel === 'Eléctrico' ? 'selected' : ''}>Eléctrico</option>
              </select>
            </label>
            <label>Estado
              <select data-k="status">
                <option ${c.status === 'Disponible' ? 'selected' : ''}>Disponible</option>
                <option ${c.status === 'Reservado' ? 'selected' : ''}>Reservado</option>
                <option ${c.status === 'Vendido' ? 'selected' : ''}>Vendido</option>
              </select>
            </label>
            <label class="full">
              Subir Imágenes ${imagesCount > 0 ? `(Tiene ${imagesCount} fotos)` : ''}
              <input type="file" multiple accept="image/*" class="file-input">
            </label>
            <label class="full">Descripción<textarea data-k="description" rows="3">${esc(c.description)}</textarea></label>
          </div>
        </section>
      `}).join('');
      bindStock();
    }

    function bindStock() {
      // Inputs de texto
      document.querySelectorAll('[data-k]').forEach(el => el.addEventListener('input', e => {
        const card = e.target.closest('.card');
        const i = +card.dataset.i;
        const k = e.target.dataset.k;
        
        cars[i][k] = ['year', 'price', 'km'].includes(k) ? Number(e.target.value) : e.target.value;
        marcarSucio(card, i);
      }));

      // Input de archivos (Imágenes)
      document.querySelectorAll('.file-input').forEach(el => el.addEventListener('change', e => {
        const card = e.target.closest('.card');
        const i = +card.dataset.i;
        
        cars[i]._files = Array.from(e.target.files);
        marcarSucio(card, i);
      }));
      
      document.querySelectorAll('.del').forEach(b => b.onclick = async () => {
        if (!confirm('¿Eliminar definitivamente este vehículo de la base de datos?')) return;
        const i = +b.dataset.i;
        const car = cars[i];
        if (car._isNew) { cars.splice(i, 1); renderStock(); return; }

        try {
          b.textContent = '...';
          b.disabled = true;
          const res = await fetch(`${VEHICLES_API_URL}/${car.id}`, {
            method: 'DELETE',
            headers: { 'Authorization': `Bearer ${getToken()}` }
          });
          if (res.status === 401) return logout();
          if (!res.ok) throw new Error('Error al eliminar');
          cars.splice(i, 1);
          renderStock();
          status('Vehículo eliminado');
        } catch (err) {
          alert(err.message);
          b.textContent = 'Eliminar';
          b.disabled = false;
        }
      });
    }

    function marcarSucio(card, i) {
      cars[i]._isDirty = true;
      dirty = true; 
      status('Cambios sin guardar ⚠️');
      card.style.border = '2px solid var(--red)';
    }

    function status(t) { document.getElementById('status').textContent = t; }

    document.getElementById('addBtn').onclick = () => { 
      cars.unshift({ 
        id: 'temp-' + Date.now(), 
        brand: 'Marca', model: 'Modelo', year: new Date().getFullYear(), 
        price: 0, km: 0, transmission: 'Automática', fuel: 'Bencina', 
        status: 'Disponible', image: '', description: '',
        _isNew: true, _isDirty: true
      }); 
      dirty = true; 
      renderStock(); 
      status('Vehículo nuevo (Falta guardar)'); 
      window.scrollTo({ top: 0, behavior: 'smooth' }); 
    };

    const saveBtn = document.getElementById('saveBtn');
    if (saveBtn) {
      saveBtn.onclick = async () => { 
        const carsToSave = cars.filter(c => c._isDirty);
        
        if (carsToSave.length === 0) {
          status('No hay cambios pendientes');
          return;
        }

        saveBtn.textContent = 'Guardando datos y subiendo fotos...';
        saveBtn.disabled = true;

        try {
          for (let car of carsToSave) {
            const isNew = car._isNew;
            
            const payload = {
              brand: car.brand, model: car.model, year: Number(car.year),
              price: Number(car.price), km: Number(car.km), transmission: car.transmission,
              fuel: car.fuel, status: car.status, description: car.description || ''
            };

            const dataUrl = isNew ? VEHICLES_API_URL : `${VEHICLES_API_URL}/${car.id}`;
            const dataMethod = isNew ? 'POST' : 'PATCH';

            const dataRes = await fetch(dataUrl, {
              method: dataMethod,
              headers: { 
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${getToken()}`
              },
              body: JSON.stringify(payload)
            });

            if (dataRes.status === 401) { logout(); throw new Error('Sesión expirada'); }
            if (!dataRes.ok) throw new Error(`Error guardando datos de ${car.brand}`);
            
            const savedCar = await dataRes.json();
            const realCarId = savedCar.id;

            if (car._files && car._files.length > 0) {
              status(`Subiendo ${car._files.length} fotos para ${car.brand}...`);
              
              for (const file of car._files) {
                const formData = new FormData();
                formData.append('file', file); 

                const imgRes = await fetch(`${VEHICLES_API_URL}/${realCarId}/image`, {
                  method: 'POST',
                  headers: { 'Authorization': `Bearer ${getToken()}` },
                  body: formData
                });

                if (!imgRes.ok) console.error(`Falló la subida de una imagen para el auto ${realCarId}`);
              }
            }
          }

          await loadStock(); 
          status('✓ Stock actualizado correctamente (con fotos)');
        } catch (err) {
          alert(err.message);
          status('Error al guardar');
        } finally {
          saveBtn.textContent = 'Guardar cambios del stock';
          saveBtn.disabled = false;
        }
      };
    }

    window.addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });
    
    // Iniciar
    document.addEventListener('DOMContentLoaded', checkAuth);
  </script>
</body>
</html>
